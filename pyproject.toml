[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stepik-autonomous-agent"
version = "0.1.0"
description = "Local, controlled AI agent for supported Stepik coursework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Stepik Bot contributors" }]
dependencies = [
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "openai>=1.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "structlog>=24.1,<27",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "respx>=0.21,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
stepik-agent = "stepik_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stepik_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["stepik_agent"]
mypy_path = "src"
